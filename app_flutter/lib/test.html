<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartPredict - Login</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #111827, #0B1220);
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen text-white">

  <!-- Container -->
  <div class="w-full max-w-md bg-gray-900/80 backdrop-blur-md p-8 rounded-2xl shadow-2xl border border-gray-800">

    <!-- Logo -->
    <div class="text-center mb-6">
      <div class="text-3xl font-bold text-cyan-400">SmartPredict</div>
      <p class="text-gray-400 text-sm mt-2">
        Maintenance prédictive intelligente
      </p>
    </div>

    <!-- Form -->
    <form class="space-y-5">

      <!-- Email -->
      <div>
        <label class="text-sm text-gray-300">Email</label>
        <input 
          type="email" 
          placeholder="ex: admin@smartpredict.com"
          class="w-full mt-1 p-3 rounded-lg bg-gray-800 border border-gray-700 focus:border-cyan-400 focus:outline-none"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="text-sm text-gray-300">Mot de passe</label>
        <div class="relative">
          <input 
            type="password"
            placeholder="••••••••"
            class="w-full mt-1 p-3 rounded-lg bg-gray-800 border border-gray-700 focus:border-cyan-400 focus:outline-none"
          />
          <span class="absolute right-3 top-4 text-gray-400 cursor-pointer text-sm">
            👁
          </span>
        </div>
      </div>

      <!-- Options -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-gray-400">
          <input type="checkbox" class="accent-cyan-400">
          Se souvenir de moi
        </label>

        <a href="#" class="text-cyan-400 hover:underline">
          Mot de passe oublié ?
        </a>
      </div>

      <!-- Button -->
      <button 
        type="submit"
        class="w-full bg-cyan-500 hover:bg-cyan-600 transition p-3 rounded-lg font-semibold shadow-lg shadow-cyan-500/20"
      >
        Se connecter
      </button>

    </form>

    <!-- Footer -->
    <p class="text-center text-xs text-gray-500 mt-6">
      Accès sécurisé aux systèmes industriels
    </p>

  </div>

</body>
</html>
